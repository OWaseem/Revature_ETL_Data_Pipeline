<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETL Pipeline Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }

        .navbar { background-color: #1a1f2e; border-bottom: 2px solid #0d6efd; }
        .navbar-brand { font-size: 1.1rem; letter-spacing: 0.5px; }
        .nav-link { color: #adb5bd !important; font-size: 0.9rem; }
        .nav-link:hover { color: #fff !important; }
        .nav-link.active { color: #fff !important; font-weight: 600; border-bottom: 2px solid #0d6efd; }

        .stat-card { border-left: 4px solid #0d6efd; background: #fff; }
        .reject-card { border-left: 4px solid #dc3545; background: #fff; }
        .stat-card h2, .reject-card h2 { font-size: 2rem; font-weight: 700; }

        .clickable-card { cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
        .clickable-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.1) !important; }

        table { font-size: 0.875rem; }
        .table thead th { font-size: 0.8rem; letter-spacing: 0.5px; text-transform: uppercase; }

        footer { background-color: #1a1f2e; color: #adb5bd; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                &#9726; ETL Pipeline Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Overview</a>
                <a class="nav-link {% if request.path == '/travel' %}active{% endif %}" href="/travel">Travel Summary</a>
                <a class="nav-link {% if request.path == '/rejects' %}active{% endif %}" href="/rejects">
                    Rejects <span class="badge bg-danger ms-1">{{ reject_count }}</span>
                </a>
                <a class="nav-link {% if request.path == '/erd' %}active{% endif %}" href="/erd">ERD</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="py-3 mt-5">
        <div class="container text-center">
            Revature ETL Data Pipeline &mdash; Built with Python, PostgreSQL &amp; Flask
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
